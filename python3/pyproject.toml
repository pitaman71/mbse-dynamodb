[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mbse-dynamodb"
version = "0.1.0"
description = "An mbse-schemas store journaled to DynamoDB (mbse-basis FEA-006)."
requires-python = ">=3.11"
dependencies = [
    "mbse-schemas>=0.26.2,<0.27",
    "mbse-rest>=0.1.0,<0.2",
    "boto3>=1.43.118",
]

[tool.setuptools.packages.find]
include = ["mbse*"]
namespaces = true

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mbse-demo-apps>=0.1.0,<0.2",
    "moto[dynamodb]>=5.2.4",
    "pytest>=9.1.1",
]

[tool.uv.sources]
mbse-schemas = { path = "../../mbse-schemas/python3", editable = true }  # the sibling checkouts: ../mbse-basis/scripts/polyrepo.py
mbse-rest = { path = "../../mbse-rest/python3", editable = true }
mbse-demo-apps = { path = "../../mbse-demo-apps/python3", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
