[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mbse-dynamodb"
version = "0.1.0"
description = "An mbse-schemas store journaled to DynamoDB (VISUALIZATION.md, FEA-006)."
requires-python = ">=3.11"
dependencies = ["mbse-schemas>=0.24.0,<0.25", "mbse-rest>=0.1.0,<0.2"]

[tool.setuptools.packages.find]
include = ["mbse*"]
namespaces = true

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv.sources]
mbse-schemas = { path = "../../mbse-schemas/python3", editable = true }  # the sibling checkouts: ../mbse-basis/scripts/polyrepo.py
mbse-rest = { path = "../../mbse-rest/python3", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
